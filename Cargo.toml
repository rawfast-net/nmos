[package]
name = "nmos"
version = "0.3.1"
edition = "2021"
description = "NoMoreOverSell — check VDS claims vs reality"
license = "MIT"

[[bin]]
name = "nmos"
path = "src/main.rs"

[dependencies]
sysinfo = "0.33"
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
colored = "3"
rusqlite = { version = "0.32.1", features = ["bundled"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
