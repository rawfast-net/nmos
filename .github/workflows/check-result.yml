name: Check result
on:
  issues:
    types: [opened, edited]
permissions:
  contents: read
jobs:
  check:
    if: startsWith(github.event.issue.title, 'VDS результат:') && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - run: node scripts/moderate.mjs "$GITHUB_EVENT_PATH" --check
